name: WinDroid Bootstrap and APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windroid-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout WinDroid
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import upstream source once
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .bootstrap-complete ]; then
            cp README.md /tmp/windroid-readme.md
            cp .github/workflows/windroid-bootstrap-build.yml /tmp/windroid-bootstrap-build.yml

            git fetch --depth=1 https://github.com/Stredohori/Winlator-CMOD.git winlator_bionic
            git reset --hard FETCH_HEAD

            mkdir -p .github/workflows
            cp /tmp/windroid-readme.md README.md
            cp /tmp/windroid-bootstrap-build.yml .github/workflows/windroid-bootstrap-build.yml
            cat > .bootstrap-complete <<'EOF'
          Imported Stredohori/Winlator-CMOD branch winlator_bionic.
          This marker prevents re-importing upstream on later runs.
          EOF

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Import Winlator-CMOD source for WinDroid"
            git push --force origin HEAD:main
          else
            echo "Source already imported; skipping bootstrap."
          fi

      - name: Initialize source submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa libc6 lib32z1

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windroid-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
