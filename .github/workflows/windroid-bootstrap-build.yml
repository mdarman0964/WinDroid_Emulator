name: WinDroid Bootstrap and APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windroid-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout WinDroid
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import upstream source once
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .bootstrap-complete ]; then
            cp README.md /tmp/windroid-readme.md
            cp .github/workflows/windroid-bootstrap-build.yml /tmp/windroid-bootstrap-build.yml

            git clone --depth 1 --branch winlator_bionic --recurse-submodules https://github.com/Stredohori/Winlator-CMOD.git /tmp/winlator-cmod

            rsync -a --delete \
              --exclude='.git' \
              --exclude='.github/workflows/***' \
              /tmp/winlator-cmod/ ./

            mkdir -p .github/workflows
            cp /tmp/windroid-readme.md README.md
            cp /tmp/windroid-bootstrap-build.yml .github/workflows/windroid-bootstrap-build.yml
            cat > .bootstrap-complete <<'EOF'
          Imported Stredohori/Winlator-CMOD branch winlator_bionic.
          The source was copied without upstream Git history; this marker prevents re-importing it.
          EOF

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Import Winlator-CMOD source for WinDroid"
            git push origin HEAD:main
          else
            echo "Source already imported; skipping bootstrap."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa libc6 lib32z1 rsync

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windroid-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Report APK size
        if: success()
        run: du -h app/build/outputs/apk/debug/app-debug.apk

      - name: Publish debug APK release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --title "WinDroid Debug APK #${GITHUB_RUN_NUMBER}" \
            --notes "Automated WinDroid debug build for device testing. Runtime system archives are downloaded and checksum-verified on first launch."
